name: crate

services:
  crate:
    image: crate-server:local
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - crate-data:/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crate-data:
