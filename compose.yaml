name: crate

services:
  crate:
    # The published image; set CRATE_VERSION to pin a release. From a checkout,
    # docker compose up -d --build builds this tag from source instead.
    image: ghcr.io/kaanbiryol/crate-server:${CRATE_VERSION:-latest}
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - crate-data:/data
      # For automatic backups outside the data volume (see docs/self-hosting.md):
      # - ./backups:/backups
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crate-data:
