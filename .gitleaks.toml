title = "Crate secret scanning"
[extend]
useDefault = true

[[allowlists]]
description = "Published Crate OAuth client ID used with PKCE"
condition = "AND"
paths = ['''(?:^|/)vite\.config\.mts$''']
regexTarget = "secret"
regexes = ['''^9c474af284e49ff0201106f3b42cca05$''']

[[allowlists]]
description = "Synthetic path tag secrets (the bytes 0-31) in a unit test"
condition = "AND"
paths = ['''(?:^|/)src/encryption/path-tags\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^A[AQ]ECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8$''']
