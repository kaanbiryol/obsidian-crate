name: Release runner diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --yes --package=node@22.14.0 node node_modules/playwright/cli.js install --with-deps chromium webkit
      - run: npm run build:worker
      - name: Native keyboard focus with a display
        continue-on-error: true
        env:
          CRATE_PWA_PREBUILT: '1'
        run: xvfb-run --auto-servernum timeout 180s node scripts/pwa-settings-test.mjs
      - name: Delete header geometry
        continue-on-error: true
        env:
          CRATE_PWA_PREBUILT: '1'
        run: xvfb-run --auto-servernum timeout 180s node scripts/pwa-inline-delete-test.mjs
      - name: Safe area and clipboard with a display
        continue-on-error: true
        env:
          CRATE_PWA_PREBUILT: '1'
        run: xvfb-run --auto-servernum timeout 180s node scripts/pwa-safe-area-test.mjs
      - name: Sheet opening with a display
        continue-on-error: true
        env:
          CRATE_PWA_PREBUILT: '1'
        run: xvfb-run --auto-servernum timeout 180s node scripts/pwa-sheet-opening-test.mjs
