name: Shared UI visual checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Generate candidate baselines for review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  visual:
    # Match the reviewed snapshot platform; system fonts differ on Linux.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --yes --package=node@22.14.0 node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck:visual
      - name: Compare shared UI screenshots
        if: inputs.update_baselines != true
        run: npm run test:visual
      - name: Generate candidate baselines
        if: inputs.update_baselines == true
        run: npm run test:visual -- --update-snapshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shared-ui-visual-review
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.update_baselines == true
        with:
          name: shared-ui-candidate-baselines
          path: tests/visual/baselines/
          retention-days: 7
