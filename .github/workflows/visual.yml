name: Shared UI visual checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Generate candidate baselines for review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  visual:
    # Match the reviewed snapshot platform; system fonts differ on Linux.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck:visual
      - name: Compare shared UI screenshots
        if: inputs.update_baselines != true
        run: npm run test:visual
      - name: Generate candidate baselines
        if: inputs.update_baselines == true
        run: npm run test:visual -- --update-snapshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shared-ui-visual-review
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.update_baselines == true
        with:
          name: shared-ui-candidate-baselines
          path: tests/visual/baselines/
          retention-days: 7
