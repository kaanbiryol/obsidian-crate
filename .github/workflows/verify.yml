name: Release verification

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify (defaults to the caller's commit)
        type: string
        default: ""
      release-tag:
        description: Release tag, also used to select the server revision baseline
        type: string
        default: ""

permissions:
  contents: read

env:
  # Caller workflow env is not inherited by reusable workflows.
  RELEASE_TAG: ${{ inputs.release-tag }}

jobs:
  checks:
    name: Source checks and release artifacts
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check dependencies and source security
        run: npm run security:check
      - name: Check source, server revision and unit tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:source
      - name: Check visual and editor types
        run: npm run typecheck:visual
      - name: Build plugin
        run: npm run build:plugin
      - name: Smoke test built PWA
        env:
          CRATE_PWA_PREBUILT: '1'
        run: npm run test:pwa-preview
      - name: Verify release artifacts
        run: npm run check:css-scope && npm run size-check && npm run verify:release-artifacts
      - name: Record candidate
        run: npm run release:candidate
      - name: Prepare release assets
        if: inputs.release-tag != ''
        run: |
          mkdir release
          cp dist/main.js dist/styles.css manifest.json THIRD_PARTY_NOTICES.md release/
      - name: Upload release assets for gated publishing
        if: inputs.release-tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7

  worker:
    name: Worker integration tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:worker-runtime
      - name: Verify shortcut pairing and template
        run: node --test scripts/reading-shortcut-server.test.mjs scripts/reading-shortcut.test.mjs
      - name: Verify persistent local hosting
        run: node --test scripts/local-server.test.mjs scripts/local-server-tunnel.test.mjs scripts/local-server-quick.test.mjs scripts/local-server-pairing.test.mjs scripts/local-server-backup.test.mjs
      - name: Verify standalone npx server package
        run: npm run test:server-package

  docker:
    name: Docker server (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Build and verify persistent Docker hosting
        run: npm run test:docker

  visual:
    name: Visual tests (${{ matrix.shard }}/2)
    # Keep the reviewed snapshot platform; system fonts differ on Linux.
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browser test runtimes
        run: npx --yes --package=node@22.14.0 node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run build
      - name: Compare shared UI screenshots
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          include-hidden-files: true
          retention-days: 7

  editor:
    name: Editor and activity browser tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browser test runtimes
        run: npx --yes --package=node@22.14.0 node node_modules/playwright/cli.js install --with-deps chromium webkit
      - run: npm run build
      - name: Check editor contracts
        run: npx playwright test --config tests/editor-contract/playwright.config.ts
      - name: Check activity browser behavior
        run: npm run test:activity-browser
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-activity
          path: |
            .generated/editor-contract/current/
            .generated/activity-diff/
            .generated/conflict-review/
          include-hidden-files: true
          retention-days: 7

  pwa:
    name: PWA browser tests (${{ matrix.shard }}/4)
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browser test runtimes
        run: npx --yes --package=node@22.14.0 node node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Run browser group
        run: npm run test:pwa-browser -- --shard=${{ matrix.shard }}/4
      - name: Verify iPhone shortcut setup
        if: matrix.shard == 1
        run: node --test scripts/reading-shortcut-browser.test.mjs
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-failures-${{ matrix.shard }}
          path: |
            .generated/browser-failures/
            test-results/reading/
          include-hidden-files: true
          retention-days: 7
