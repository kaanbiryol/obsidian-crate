name: Release verification

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify (defaults to the caller's commit)
        type: string
        default: ""
      release-tag:
        description: Release tag, also used to select the server revision baseline
        type: string
        default: ""
      reuse-run-id:
        description: Successful exact-commit push build whose artifacts passed all checks
        type: string
        default: ""
      parent-run-id:
        description: Successful push build of the parent commit; this commit may change only the release version
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  # Caller workflow env is not inherited by reusable workflows.
  RELEASE_TAG: ${{ inputs.release-tag }}
  VERIFIED_RUN_ID: ${{ inputs.reuse-run-id || github.run_id }}

jobs:
  checks:
    name: Source checks and release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Recheck the version-only parent push verification
        if: inputs.parent-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PARENT_RUN_ID: ${{ inputs.parent-run-id }}
        run: node scripts/release-verification.mjs check-parent "$PARENT_RUN_ID"
      - name: Check dependencies for advisories
        run: npm run security:audit
      # An advisory must not hide the secret scan result.
      - name: Scan source and history for secrets
        if: ${{ !cancelled() }}
        run: npm run security:secrets
      # These are the npm run check:source commands, one step each so an early
      # failure does not hide the results of later checks.
      - name: Build the Worker and PWA assets
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm run build:worker
      - name: Lint
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm run lint
      - name: Type-check the plugin
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm run typecheck
      - name: Type-check the Worker
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm run typecheck:worker
      - name: Type-check the service worker
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm run typecheck:service-worker
      - name: Check for dead code
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm run deadcode
      - name: Check third-party notices
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm run notices:check
      - name: Check contract documentation
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm run check:contracts
      - name: Run tooling and release tests
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm run test:ci
      - name: Test the server revision check
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm run test:server-revision
      - name: Test recovery tooling
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm run test:recovery
      - name: Run unit tests
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        run: npm test
      # Not part of check:source: it needs full Git history and gh. release:check runs it too.
      - name: Check the server revision
        if: ${{ !cancelled() && inputs.reuse-run-id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:server-revision
      - name: Recheck the completed push verification
        if: inputs.reuse-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE_RUN_ID: ${{ inputs.reuse-run-id }}
        run: node scripts/release-verification.mjs check "$REUSE_RUN_ID"
      - name: Download exact-commit release assets
        if: inputs.reuse-run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
          run-id: ${{ inputs.reuse-run-id }}
          github-token: ${{ github.token }}
      - name: Refresh the release baseline and verify artifact identity
        if: inputs.reuse-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:server-revision && node scripts/release-artifacts.mjs restore
      - name: Check visual and editor types
        if: inputs.reuse-run-id == ''
        run: npm run typecheck:visual
      - name: Build plugin
        if: inputs.reuse-run-id == ''
        run: npm run build:plugin
      - name: Smoke test built PWA
        if: inputs.reuse-run-id == ''
        env:
          CRATE_WORKER_PREBUILT: '1'
        run: npm run test:pwa-preview
      - name: Verify release artifacts
        run: npm run check:css-scope && npm run size-check && npm run verify:release-artifacts
      - name: Record candidate
        if: inputs.reuse-run-id == ''
        run: npm run release:candidate
      - name: Prepare release assets
        if: inputs.reuse-run-id == ''
        run: node scripts/release-artifacts.mjs stage
      - name: Upload release assets for gated publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7

  reproducible:
    name: Verify reproducible release
    needs: checks
    if: inputs.release-tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download checked release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - name: Rebuild from a clean install
        run: npm ci && npm run build
      - name: Compare original and reproduced artifacts
        run: node scripts/release-artifacts.mjs reproduce

  worker:
    name: Worker integration tests
    # A version-only release commit reuses its parent's browser and runtime tests.
    if: inputs.reuse-run-id == '' && inputs.parent-run-id == ''
    runs-on: ubuntu-24.04
    container:
      # Match package-lock.json; browsers and OS dependencies are preinstalled.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:worker-runtime
      - name: Verify Reading extraction, server and shortcut contracts
        run: npm run test:reading-server
      - name: Verify persistent local hosting
        run: node --test "packages/server/test/*.test.mjs"
      - name: Verify standalone npx server package
        run: npm run test:server-package

  docker:
    name: Docker server (${{ matrix.runner }})
    if: inputs.reuse-run-id == '' && inputs.parent-run-id == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build and verify persistent Docker hosting
        run: npm run test:docker

  visual:
    name: Visual tests (${{ matrix.shard }}/2)
    if: inputs.reuse-run-id == '' && inputs.parent-run-id == ''
    # Keep the reviewed snapshot platform; system fonts differ on Linux.
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Reuses this macOS runner; the parser check needs plutil.
      - name: Check the native shortcut parser
        run: node --test scripts/reading-shortcut.test.mjs
      - name: Install browser test runtimes
        run: npx --yes --package=node@22.14.0 node node_modules/playwright/cli.js install --with-deps chromium webkit
      # Types are checked once in the checks job; browser jobs need only the build output.
      - run: npm run build:worker && npm run build:plugin
      - name: Compare shared UI screenshots
        run: node scripts/visual-test-run.mjs --shard=${{ matrix.shard }}/2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          include-hidden-files: true
          retention-days: 7

  editor:
    name: Editor and activity browser tests (${{ matrix.shard }}/4)
    if: inputs.reuse-run-id == '' && inputs.parent-run-id == ''
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Types are checked once in the checks job; browser jobs need only the build output.
      - run: npm run build:worker && npm run build:plugin
      - name: Check editor contracts
        run: npx playwright test --config tests/editor-contract/playwright.config.ts --shard=${{ matrix.shard }}/4
      - name: Check activity browser behavior
        if: matrix.shard == 1
        run: npm run test:activity-browser
      - name: Check file and vault history browser behavior
        if: matrix.shard == 2
        run: npm run test:file-history-browser
      - name: Check plugin dialog consistency
        if: matrix.shard == 3
        run: npm run test:plugin-dialogs
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-activity-${{ matrix.shard }}
          path: |
            .generated/editor-contract/current/
            .generated/activity-diff/
            .generated/conflict-review/
            .generated/file-history/
            .generated/plugin-dialog-review/
            .generated/encryption-ui-review/
          include-hidden-files: true
          retention-days: 7

  pwa:
    name: PWA browser tests (${{ matrix.shard }}/4)
    if: inputs.reuse-run-id == '' && inputs.parent-run-id == ''
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Types are checked once in the checks job; browser jobs need only the build output.
      - run: npm run build:worker && npm run build:plugin
      - name: Run browser group
        run: npm run test:pwa-browser -- --platform=linux --shard=${{ matrix.shard }}/4
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-failures-${{ matrix.shard }}
          path: |
            .generated/browser-failures/
            test-results/reading/
          include-hidden-files: true
          retention-days: 7

  pwa-native:
    name: Native PWA browser tests (${{ matrix.shard }}/2)
    if: inputs.reuse-run-id == '' && inputs.parent-run-id == ''
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install native browser test runtimes
        run: npx --yes --package=node@22.14.0 node node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Check native browser behavior
        run: npm run test:pwa-browser -- --platform=macos --shard=${{ matrix.shard }}/2
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-native-failures-${{ matrix.shard }}
          path: |
            .generated/browser-failures/
            test-results/reading/
          include-hidden-files: true
          retention-days: 7

  reading:
    name: Reading browser tests (${{ matrix.group }})
    if: inputs.reuse-run-id == '' && inputs.parent-run-id == ''
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [library, annotations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Types are checked once in the checks job; browser jobs need only the build output.
      - run: npm run build:worker && npm run build:plugin
      - run: npm run test:reading-browser:${{ matrix.group }}
      - name: Upload Reading browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reading-browser-${{ matrix.group }}
          path: test-results/
          retention-days: 7
