name: Publish server image

# Publishes ghcr.io/<owner>/crate-server with the plugin's version once its GitHub
# release is published, never from a draft or pre-release, so Docker users can update
# with docker compose pull. The image is built from the release tag for amd64 and arm64.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to publish as an image
        required: true
        type: string

concurrency:
  group: publish-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

jobs:
  publish:
    name: Build and push the image
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check the release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "$RELEASE_TAG" || { echo "Tag $RELEASE_TAG does not match package version $version"; exit 1; }
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = "false" || { echo "Refusing to publish a draft or pre-release"; exit 1; }
          # Publishing an older release keeps latest on the newest version.
          newest="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crate-server" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$newest" = "$RELEASE_TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            ${{ steps.check.outputs.image }}:${{ env.RELEASE_TAG }}
            ${{ steps.check.outputs.latest == 'true' && format('{0}:latest', steps.check.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=MIT
