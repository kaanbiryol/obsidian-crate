name: Node.js build

on:
  # Other branches run through their pull request, so a PR head is verified once.
  # Release reuse accepts only push runs, from master or release/<tag>.
  push:
    branches: ["master", "release/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Optional release baseline for a verification-only reproducibility check
        type: string
        default: ""
      reuse-run-id:
        description: Optional successful exact-commit push run to verify artifact reuse
        type: string
        default: ""
      parent-run-id:
        description: Optional successful push run of the parent commit to verify version-only reuse
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      release-tag: ${{ inputs.release-tag || '' }}
      reuse-run-id: ${{ inputs.reuse-run-id || '' }}
      parent-run-id: ${{ inputs.parent-run-id || '' }}
  # Keep the existing aggregate check name for branch protection.
  build:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
