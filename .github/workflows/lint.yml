name: Node.js build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  # Keep the existing aggregate check name for branch protection.
  build:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
