name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
      - "scripts/sign-reading-shortcut.mjs"
      - "scripts/reading-shortcut-first-run.mjs"
      - "scripts/reading-shortcut.test.mjs"
      - "docs/shortcuts/save-to-crate.plist"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The pairing template uses iOS 27 shortcut-scoped storage. Signing it
    # requires macOS 27; macos-26 rejects its minimum client version.
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check dependencies and source for security findings
        run: npm run security:check
      - name: Build site styles
        run: npm run build:site
      - name: Verify and sign the public iPhone shortcut
        run: |
          node --test scripts/reading-shortcut.test.mjs
          npm run build:reading-shortcut -- --pairing
          mkdir -p site/shortcuts/v1
          cp "dist/Save to Crate (iOS 27).shortcut" "site/shortcuts/v1/Save to Crate (iOS 27).shortcut"
      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
