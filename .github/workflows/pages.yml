name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs-site/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/pages.yml"
      - "scripts/download-release-shortcut.mjs"
      - "scripts/shortcut-release.mjs"
      - "scripts/shortcut-release.test.mjs"
      - "scripts/shortcut-install-page.mjs"
      - "scripts/sign-reading-shortcut.mjs"
      - "scripts/reading-shortcut-first-run.mjs"
      - "scripts/reading-shortcut.test.mjs"
      - "scripts/reading-shortcut-template.mjs"
      - "tests/browser/support/reading-shortcut-fixture.mjs"
      - "scripts/build-shortcut-support.mjs"
      - "scripts/raw-text-plugin.mjs"
      - "scripts/build-site-images.mjs"
      - "scripts/site-deployment.mjs"
      - "scripts/site-deployment.test.mjs"
      - "scripts/build-changelog.mjs"
      - "scripts/build-changelog.test.mjs"
      - "src/reading/shortcut-contract.json"
      - "src/reading/shortcut.ts"
      - "src/cloudflare/server-release.json"
      - "src/cloudflare/worker/reading/save-page.ts"
      - "src/cloudflare/worker/reading/save-client.ts"
      - "src/platform/validation.ts"
      - "src/protocol/server-build.ts"
      - "src/protocol/server-info.ts"
      - "src/pwa/shell/version.ts"
      - "docs/shortcuts/save-to-crate.plist"
      - "tests/fixtures/reading-shortcut-v1.plist"
  pull_request:
    paths:
      - "site/**"
      - "docs-site/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/pages.yml"
      - "scripts/download-release-shortcut.mjs"
      - "scripts/shortcut-release.mjs"
      - "scripts/shortcut-release.test.mjs"
      - "scripts/shortcut-install-page.mjs"
      - "scripts/sign-reading-shortcut.mjs"
      - "scripts/reading-shortcut-first-run.mjs"
      - "scripts/reading-shortcut.test.mjs"
      - "scripts/reading-shortcut-template.mjs"
      - "tests/browser/support/reading-shortcut-fixture.mjs"
      - "scripts/build-shortcut-support.mjs"
      - "scripts/raw-text-plugin.mjs"
      - "scripts/build-site-images.mjs"
      - "scripts/site-deployment.mjs"
      - "scripts/site-deployment.test.mjs"
      - "scripts/build-changelog.mjs"
      - "scripts/build-changelog.test.mjs"
      - "src/reading/shortcut-contract.json"
      - "src/reading/shortcut.ts"
      - "src/cloudflare/server-release.json"
      - "src/cloudflare/worker/reading/save-page.ts"
      - "src/cloudflare/worker/reading/save-client.ts"
      - "src/platform/validation.ts"
      - "src/protocol/server-build.ts"
      - "src/protocol/server-info.ts"
      - "src/pwa/shell/version.ts"
      - "docs/shortcuts/save-to-crate.plist"
      - "tests/fixtures/reading-shortcut-v1.plist"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy if changed; leave empty to force-deploy master"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A queued pull request build must never replace a pending deployment.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The shortcut template's plutil check skips here and runs in the macOS visual job;
    # signing runs only on the maintainer’s Mac.
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.website.outputs.deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ (github.event.release.tag_name || inputs.release_tag)
                && format('refs/tags/{0}', github.event.release.tag_name || inputs.release_tag)
                || (github.event_name == 'workflow_dispatch' && 'master' || github.sha) }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix docs-site ci
      - name: Check documentation
        run: npm run check:docs
      - name: Verify shortcut template and website downloads
        run: node --test scripts/reading-shortcut.test.mjs scripts/shortcut-release.test.mjs scripts/site-deployment.test.mjs scripts/build-changelog.test.mjs
      - name: Build shortcut support page
        run: node scripts/build-shortcut-support.mjs
      - name: Download the supported shortcut
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/download-release-shortcut.mjs published site/shortcuts/v1 --install-page
      - name: Build changelog from published release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/build-changelog.mjs site/changelog
      # Documentation links include the generated shortcut installation page.
      - name: Build static site and documentation
        run: npm run build:site
      - name: Compare with the deployed website
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        id: website
        env:
          SITE_DEPLOY_FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_tag }}
        run: node scripts/site-deployment.mjs
      - name: Upload static site
        if: steps.website.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    if: github.event_name != 'push' && github.event_name != 'pull_request' && needs.build.outputs.deploy == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
