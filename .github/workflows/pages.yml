name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs-site/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
      - "scripts/download-release-shortcut.mjs"
      - "scripts/shortcut-release.mjs"
      - "scripts/shortcut-release.test.mjs"
      - "scripts/shortcut-install-page.mjs"
      - "scripts/sign-reading-shortcut.mjs"
      - "scripts/reading-shortcut-first-run.mjs"
      - "scripts/reading-shortcut.test.mjs"
      - "scripts/reading-shortcut-template.mjs"
      - "scripts/reading-shortcut-fixture.mjs"
      - "scripts/build-shortcut-support.mjs"
      - "scripts/build-site-images.mjs"
      - "scripts/site-deployment.mjs"
      - "scripts/site-deployment.test.mjs"
      - "src/reading/shortcut-contract.json"
      - "src/cloudflare/worker/reading/save-page.ts"
      - "src/cloudflare/worker/reading/save-client.ts"
      - "docs/shortcuts/save-to-crate.plist"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy if changed; leave empty to force-deploy master"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Template tests use macOS plutil; signing runs only on the maintainer’s Mac.
    runs-on: macos-26
    outputs:
      deploy: ${{ steps.website.outputs.deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ (github.event.release.tag_name || inputs.release_tag)
                && format('refs/tags/{0}', github.event.release.tag_name || inputs.release_tag)
                || (github.event_name == 'workflow_dispatch' && 'master' || github.sha) }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix docs-site ci
      - name: Check dependencies and source for security findings
        run: npm run security:check
      - name: Check documentation
        run: npm run check:docs
      - name: Verify shortcut template and website downloads
        run: node --test scripts/reading-shortcut.test.mjs scripts/shortcut-release.test.mjs scripts/site-deployment.test.mjs
      - name: Build shortcut support page
        run: node scripts/build-shortcut-support.mjs
      - name: Download the supported shortcut
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/download-release-shortcut.mjs published site/shortcuts/v2 --install-page
      # Documentation links include the generated shortcut installation page.
      - name: Build static site and documentation
        run: npm run build:site
      - name: Compare with the deployed website
        if: github.event_name != 'push'
        id: website
        env:
          SITE_DEPLOY_FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_tag }}
        run: node scripts/site-deployment.mjs
      - name: Upload static site
        if: steps.website.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    if: github.event_name != 'push' && needs.build.outputs.deploy == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
