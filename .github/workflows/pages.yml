name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
      - "scripts/sign-reading-shortcut.mjs"
      - "scripts/reading-shortcut-first-run.mjs"
      - "scripts/reading-shortcut.test.mjs"
      - "docs/shortcuts/save-to-crate.plist"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check dependencies and source for security findings
        run: npm run security:check
      - name: Build site styles
        run: npm run build:site
      - name: Verify and sign the public iPhone shortcut
        run: |
          node --test scripts/reading-shortcut.test.mjs
          npm run build:reading-shortcut -- --pairing
          mkdir -p site/shortcuts/v1
          cp "dist/Save to Crate (iOS 27).shortcut" "site/shortcuts/v1/Save to Crate (iOS 27).shortcut"
      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
