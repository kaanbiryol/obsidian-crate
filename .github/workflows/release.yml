name: Release plugin

on:
  push:
    tags:
      - "*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and package
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and verify release tag
    runs-on: macos-26
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Verify tag version
        run: node -e "const manifest=require('./manifest.json'); if (manifest.version !== process.env.RELEASE_TAG) throw new Error('Tag must exactly match manifest.json version')"
      - name: Pin all checks to the resolved commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      release-tag: ${{ inputs.tag || github.ref_name }}

  release:
    name: Verify reproducible release
    needs: [resolve, verify]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download checked release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: verified
      - name: Record original artifact hashes
        working-directory: verified
        run: shasum -a 256 main.js styles.css > /tmp/crate-release-artifacts.sha256
      - name: Rebuild from a clean install
        run: |
          npm ci
          npm run build
      - name: Verify reproducible artifacts
        working-directory: dist
        run: shasum -a 256 --check /tmp/crate-release-artifacts.sha256

  publish:
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: release
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*

      - name: Attach verified assets to a draft or create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/crate-release-is-draft; then
            test "$(cat /tmp/crate-release-is-draft)" = "true" || { echo "Refusing to replace an already published release"; exit 1; }
            gh release upload "$RELEASE_TAG" release/main.js release/manifest.json release/styles.css release/THIRD_PARTY_NOTICES.md --clobber
          else
            gh release create "$RELEASE_TAG" release/main.js release/manifest.json release/styles.css release/THIRD_PARTY_NOTICES.md --draft --generate-notes --verify-tag --title "$RELEASE_TAG"
          fi
