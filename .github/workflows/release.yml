name: Release plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci

      - name: Verify tag version
        run: node -e "const manifest=require('./manifest.json'); if (manifest.version !== process.env.GITHUB_REF_NAME) throw new Error('Tag must exactly match manifest.json version')"

      - name: Verify release on Node.js 20
        run: npm run release:check

      - name: Record release artifact hashes
        run: sha256sum dist/main.js dist/styles.css > /tmp/crate-release-artifacts.sha256

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci

      - name: Verify release on Node.js 22
        run: npm run release:check

      - name: Verify reproducible artifacts on Node.js 22
        run: sha256sum --check /tmp/crate-release-artifacts.sha256

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: npm

      - run: npm ci

      - name: Verify release on Node.js 24
        run: npm run release:check

      - name: Verify reproducible artifacts on Node.js 24
        run: sha256sum --check /tmp/crate-release-artifacts.sha256

      - name: Prepare release assets
        run: |
          mkdir release
          cp dist/main.js release/main.js
          cp dist/styles.css release/styles.css
          cp manifest.json release/manifest.json
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*

      - name: Attach verified assets to a draft or create a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > /tmp/crate-release-is-draft; then
            test "$(cat /tmp/crate-release-is-draft)" = "true" || { echo "Refusing to replace an already published release"; exit 1; }
            gh release upload "$GITHUB_REF_NAME" release/main.js release/manifest.json release/styles.css release/THIRD_PARTY_NOTICES.md --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/main.js release/manifest.json release/styles.css release/THIRD_PARTY_NOTICES.md --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
          fi
