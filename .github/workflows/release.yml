name: Release plugin

on:
  push:
    tags:
      - "*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and package
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install browser test runtimes
        run: npx --yes --package=node@22.14.0 node node_modules/playwright/cli.js install --with-deps chromium webkit

      - name: Verify tag version
        run: node -e "const manifest=require('./manifest.json'); if (manifest.version !== process.env.RELEASE_TAG) throw new Error('Tag must exactly match manifest.json version')"

      - name: Verify release
        run: npm run release:check

      - name: Record release artifact hashes
        run: shasum -a 256 dist/main.js dist/styles.css > /tmp/crate-release-artifacts.sha256

      - name: Rebuild from a clean install
        run: |
          npm ci
          npm run build

      - name: Verify reproducible artifacts
        run: shasum -a 256 --check /tmp/crate-release-artifacts.sha256

      - name: Prepare release assets
        run: |
          mkdir release
          cp dist/main.js release/main.js
          cp dist/styles.css release/styles.css
          cp manifest.json release/manifest.json
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md

      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release/
          retention-days: 7

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: release
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*

      - name: Attach verified assets to a draft or create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/crate-release-is-draft; then
            test "$(cat /tmp/crate-release-is-draft)" = "true" || { echo "Refusing to replace an already published release"; exit 1; }
            gh release upload "$RELEASE_TAG" release/main.js release/manifest.json release/styles.css release/THIRD_PARTY_NOTICES.md --clobber
          else
            gh release create "$RELEASE_TAG" release/main.js release/manifest.json release/styles.css release/THIRD_PARTY_NOTICES.md --draft --generate-notes --verify-tag --title "$RELEASE_TAG"
          fi
