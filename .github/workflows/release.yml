name: Release plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and package
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and verify release tag
    runs-on: macos-26
    permissions:
      # GitHub requires write access to include draft releases in API results.
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify tag version
        run: node -e "const manifest=require('./manifest.json'); if (manifest.version !== process.env.RELEASE_TAG) throw new Error('Tag must exactly match manifest.json version')"
      - name: Verify locally signed shortcut in the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/download-release-shortcut.mjs draft shortcut "$RELEASE_TAG"
      - name: Pin all checks to the resolved commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      release-tag: ${{ inputs.tag }}

  release:
    name: Verify reproducible release
    needs: [resolve, verify]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download checked release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: verified
      - name: Record original artifact hashes
        working-directory: verified
        run: shasum -a 256 main.js styles.css > /tmp/crate-release-artifacts.sha256
      - name: Rebuild from a clean install
        run: |
          npm ci
          npm run build
      - name: Verify reproducible artifacts
        working-directory: dist
        run: shasum -a 256 --check /tmp/crate-release-artifacts.sha256

  publish:
    needs: [resolve, verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Recheck signed shortcut before attaching plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/download-release-shortcut.mjs draft shortcut "$RELEASE_TAG"
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Attach verified plugin assets to the prepared draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true" || { echo "Refusing to replace an already published release"; exit 1; }
          gh release upload "$RELEASE_TAG" release/main.js release/manifest.json release/styles.css release/THIRD_PARTY_NOTICES.md --clobber
