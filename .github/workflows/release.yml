name: Release plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - name: Verify tag version
        run: node -e "const manifest=require('./manifest.json'); if (manifest.version !== process.env.GITHUB_REF_NAME) throw new Error('Tag must exactly match manifest.json version')"

      - name: Verify release on Node.js 20
        run: npm run release:check

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Build release on Node.js 22
        run: npm run release:check

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Build release on Node.js 24
        run: npm run release:check

      - name: Prepare release assets
        run: |
          mkdir release
          cp dist/main.js release/main.js
          cp dist/styles.css release/styles.css
          cp manifest.json release/manifest.json

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/main.js release/manifest.json release/styles.css --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
