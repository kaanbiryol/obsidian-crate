name: Release plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci

      - name: Install browser test runtimes
        run: npx playwright install --with-deps chromium webkit

      - name: Verify tag version
        run: node -e "const manifest=require('./manifest.json'); if (manifest.version !== process.env.GITHUB_REF_NAME) throw new Error('Tag must exactly match manifest.json version')"

      - name: Verify release on Node.js 20
        run: npm run release:check

      - name: Record release artifact hashes
        run: sha256sum dist/main.js dist/styles.css > /tmp/crate-release-artifacts.sha256

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci

      - name: Verify release on Node.js 22
        run: npm run release:check

      - name: Verify reproducible artifacts on Node.js 22
        run: sha256sum --check /tmp/crate-release-artifacts.sha256

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.0.0
          cache: npm

      - run: npm ci

      - name: Verify release on Node.js 24
        run: npm run release:check

      - name: Verify reproducible artifacts on Node.js 24
        run: sha256sum --check /tmp/crate-release-artifacts.sha256

      - name: Prepare release assets
        run: |
          mkdir release
          cp dist/main.js release/main.js
          cp dist/styles.css release/styles.css
          cp manifest.json release/manifest.json
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md

      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release/
          retention-days: 7

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: release
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Attach verified assets to a draft or create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > /tmp/crate-release-is-draft; then
            test "$(cat /tmp/crate-release-is-draft)" = "true" || { echo "Refusing to replace an already published release"; exit 1; }
            gh release upload "$GITHUB_REF_NAME" release/main.js release/manifest.json release/styles.css release/THIRD_PARTY_NOTICES.md --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/main.js release/manifest.json release/styles.css release/THIRD_PARTY_NOTICES.md --draft --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
          fi
