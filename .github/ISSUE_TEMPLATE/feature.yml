name: Feature proposal
description: Describe the user problem and the behavior that would solve it.
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What are you trying to do, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Include affected clients and any offline, sync, compatibility or privacy implications.
    validations:
      required: true
