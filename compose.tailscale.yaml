# Stable public HTTPS address without a domain, through Tailscale Funnel.
# docker compose -f compose.yaml -f compose.tailscale.yaml up -d --build
# See docs/self-hosting.md for the one-time Tailscale setup.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    hostname: ${CRATE_TAILSCALE_HOSTNAME:-crate}
    restart: unless-stopped
    environment:
      # Only needed for the first sign-in; without one, the logs print a login link.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - ./packages/server/docker/tailscale-serve.json:/config/serve.json:ro

  crate:
    # Share the Tailscale container's network so Funnel reaches Crate on 127.0.0.1.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      CRATE_TAILSCALE_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - tailscale-socket:/var/run/tailscale:ro
    command: ["setup", "--tailscale", "--port", "8787"]

volumes:
  tailscale-state:
  tailscale-socket:
